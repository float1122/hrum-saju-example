<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>만세력 결과 보기 — HRUM 예제</title>
  <style>
    :root {
      --ink: #1d1a16;
      --muted: #6b645a;
      --paper: #faf7f1;
      --line: #e3ddd1;
      --wood: #3f7d4e; --fire: #c4452d; --earth: #a77b2c; --metal: #7c7f86; --water: #2c5a8a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--paper); }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
    form { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); }
    label { display: grid; gap: .25rem; font-size: .875rem; color: var(--muted); }
    input, select, button { font: inherit; padding: .5rem; border: 1px solid var(--line); border-radius: .375rem; background: #fff; }
    button { grid-column: 1 / -1; background: var(--ink); color: #fff; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
    #status { min-height: 1.5rem; margin: 1rem 0; color: var(--muted); }
    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    .pillar { text-align: center; padding: .75rem .25rem; border: 2px solid var(--line); border-radius: .5rem; background: #fff; }
    .pillar .label { font-size: .75rem; color: var(--muted); }
    .pillar .hanja { font-size: 2rem; line-height: 1.2; writing-mode: vertical-rl; margin: .25rem auto; }
    .pillar[data-ohaeng="목"] { border-color: var(--wood); }
    .pillar[data-ohaeng="화"] { border-color: var(--fire); }
    .pillar[data-ohaeng="토"] { border-color: var(--earth); }
    .pillar[data-ohaeng="금"] { border-color: var(--metal); }
    .pillar[data-ohaeng="수"] { border-color: var(--water); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1rem; margin-top: 1.5rem; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    @media (max-width: 24rem) { .pillars { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<main>
  <h1>만세력 결과 보기</h1>

  <form id="form">
    <label>년 <input name="year" type="number" required value="1990"></label>
    <label>월 <input name="month" type="number" min="1" max="12" required value="5"></label>
    <label>일 <input name="day" type="number" min="1" max="31" required value="15"></label>
    <label>시 (모르면 비워 두기) <input name="hour" type="number" min="0" max="23"></label>
    <label>분 <input name="minute" type="number" min="0" max="59"></label>
    <label>성별
      <select name="gender"><option value="male">남성</option><option value="female">여성</option></select>
    </label>
    <label>달력
      <select name="calendar"><option value="solar">양력</option><option value="lunar">음력</option></select>
    </label>
    <button type="submit">결과 보기</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden aria-labelledby="result-heading">
    <h2 id="result-heading">원국</h2>
    <div class="pillars" id="pillars"></div>
    <dl id="summary"></dl>
  </section>
</main>

<script type="module">
  const form = document.getElementById('form');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  const toInt = (v) => (v === '' || v === null ? undefined : Number(v));

  // Build every node with textContent so API strings are never parsed as HTML.
  function el(tag, attrs = {}, text) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderPillars(pillars, birthHourKnown) {
    const box = document.getElementById('pillars');
    box.replaceChildren();
    const order = [['hour', '시주'], ['day', '일주'], ['month', '월주'], ['year', '년주']];
    for (const [key, label] of order) {
      const p = pillars[key];
      const card = el('div', { class: 'pillar', 'data-ohaeng': p ? p.ohaeng : '' });
      card.append(el('div', { class: 'label' }, label));
      if (p) {
        card.append(el('div', { class: 'hanja' }, `${p.stemHanja}${p.branchHanja}`));
        card.append(el('div', {}, `${p.stem}${p.branch}`));
      } else {
        card.append(el('div', {}, birthHourKnown ? '-' : '시간 미상'));
      }
      box.append(card);
    }
  }

  function renderSummary(view) {
    const dl = document.getElementById('summary');
    dl.replaceChildren();
    const rows = [];
    if (view.ilganSummary) rows.push(['일간', view.ilganSummary]);
    if (view.ohaengBalance) {
      rows.push(['오행', Object.entries(view.ohaengBalance).map(([k, v]) => `${k} ${v}`).join(' · ')]);
    }
    if (view.ohaengDeficient.length) rows.push(['없는 오행', view.ohaengDeficient.join(' · ')]);
    if (view.yongshin) rows.push(['용신', view.yongshin]);
    if (view.currentDaeun) {
      const d = view.currentDaeun;
      rows.push(['지금 대운', `${d.stemHanja}${d.branchHanja} (${d.startAge}세부터)`]);
    }
    if (!view.birthHourKnown) rows.push(['안내', '태어난 시간을 모르면 시주를 뺀 년·월·일 기준으로 계산해요.']);
    for (const [k, v] of rows) dl.append(el('dt', {}, k), el('dd', {}, v));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(form);
    const payload = {
      year: toInt(f.get('year')),
      month: toInt(f.get('month')),
      day: toInt(f.get('day')),
      hour: toInt(f.get('hour')),
      minute: toInt(f.get('minute')),
      gender: f.get('gender'),
      calendar: f.get('calendar'),
    };
    statusEl.textContent = '불러오는 중이에요…';
    try {
      const res = await fetch('/api/manseryeok', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const json = await res.json();
      if (!json.ok) {
        statusEl.textContent = json.message;
        resultEl.hidden = true;
        return;
      }
      renderPillars(json.view.pillars, json.view.birthHourKnown);
      renderSummary(json.view);
      resultEl.hidden = false;
      statusEl.textContent = json.cached ? '저장해 둔 결과를 보여 드려요.' : '';
    } catch {
      statusEl.textContent = '서버에 연결하지 못했어요.';
    }
  });
</script>
</body>
</html>
